name: mods-release

# Rebases a throwaway copy of the `mods` branch onto the newest upstream release
# tag, builds it (ad-hoc signed) and publishes it as a release tagged `mods-<tag>-r<N>` (e.g. mods-v3.0.21-r7), where N is the number of
# mod commits on top of the upstream tag (the app compares it after the version).
# The `mods` branch itself is never rewritten.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (default: latest)"
        required: false
        type: string
      force:
        description: "Rebuild even if a release already exists"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: mods-release
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/exelban/stats.git
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    runs-on: xcode-27  # macOS 27 + Xcode 27 (preview image)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: mods

      - name: Resolve upstream tag and revision
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git ls-remote --tags --refs "$UPSTREAM" 'v[0-9]*.[0-9]*.[0-9]*' | awk '{print $2}' | sed 's|refs/tags/||' | sort -V | tail -1)
          fi
          echo "Upstream tag: $TAG"
          git config user.name "djcristi"
          git config user.email "djcristi16@gmail.com"
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream master
          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/upstream-$TAG"
          BASE=$(git merge-base HEAD upstream/master)
          REV=$(git rev-list --count "$BASE"..HEAD)
          REL="mods-$TAG-r$REV"
          echo "Mods base: $BASE, revision: $REV, release: $REL"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "rel=$REL" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" != "true" ] && gh release view "$REL" >/dev/null 2>&1; then
            echo "Release $REL already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase mods onto the tag
        if: steps.tag.outputs.skip != 'true'
        id: rebase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BASE="${{ steps.tag.outputs.base }}"
          git log --oneline "$BASE"..HEAD
          if ! git rebase --onto "upstream-$TAG" "$BASE"; then
            git rebase --abort || true
            gh issue create \
              --title "mods conflict on upstream $TAG" \
              --body "Rebasing \`mods\` onto \`$TAG\` failed with conflicts. Rebase locally (\`git rebase --onto $TAG $BASE mods\`), resolve, push \`mods\`, then re-run the **mods-release** workflow."
            exit 1
          fi

      - name: Select Xcode
        if: steps.tag.outputs.skip != 'true'
        run: sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer

      - name: Build
        if: steps.tag.outputs.skip != 'true'
        run: |
          /usr/libexec/PlistBuddy -c "Set :ModRevision ${{ steps.tag.outputs.rev }}" "Stats/Supporting Files/Info.plist"
          xcodebuild -scheme Stats -destination 'platform=macOS' -configuration Release \
            archive -archivePath build/Stats.xcarchive CODE_SIGNING_ALLOWED=NO
          mkdir -p dist
          ditto build/Stats.xcarchive/Products/Applications/Stats.app dist/Stats-mod.app
          codesign --force --deep --sign - dist/Stats-mod.app
          codesign -dv dist/Stats-mod.app 2>&1 | head -3
          ditto -c -k --keepParent dist/Stats-mod.app Stats-mod.zip
          mkdir -p dmgroot && cp -R dist/Stats-mod.app dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Stats-mod" -srcfolder dmgroot -ov -format UDZO Stats-mod.dmg

      - name: Publish release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REL="${{ steps.tag.outputs.rel }}"
          REV="${{ steps.tag.outputs.rev }}"
          gh release delete "$REL" --yes --cleanup-tag 2>/dev/null || true
          git tag -f "$REL" HEAD
          git push origin "refs/tags/$REL" --force
          gh release create "$REL" Stats-mod.dmg Stats-mod.zip --verify-tag \
            --title "Stats-mod $TAG-r$REV" \
            --notes "Upstream $TAG with the mods branch (revision $REV) rebased on top. Ad-hoc signed. First install from a browser download: run \`xattr -cr Stats-mod.app\`. Later updates are installed by the app itself."
