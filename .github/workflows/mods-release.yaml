name: mods-release

# Rebases a throwaway copy of the `mods` branch onto the newest upstream release
# tag, builds it (ad-hoc signed) and publishes it as a release tagged `<tag>-mod-r<N>` (e.g. v3.0.21-mod-r7), where N counts the mod builds released
# for that upstream tag (1 for a new tag, +1 per further build; the app compares it after the version).
# After a successful release the `mods` branch is moved onto the same rebased commit (force-with-lease) and the upstream tag is mirrored, so mods always starts at the latest upstream release.
# Triggers: daily poll (builds only for an upstream tag with no release yet), push to mods (via mods-trigger.yaml) and manual runs (both build a new -rN revision).

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (default: latest)"
        required: false
        type: string
      force:
        description: "Rebuild even if a release already exists"
        type: boolean
        default: false
  # called by mods-trigger.yaml on the mods branch, so a push to mods builds a new revision
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
      force:
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: mods-release
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/exelban/stats.git
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    runs-on: xcode-27  # macOS 27 + Xcode 27 (preview image)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: mods

      - name: Resolve upstream tag and revision
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git ls-remote --tags --refs "$UPSTREAM" 'v[0-9]*.[0-9]*.[0-9]*' | awk '{print $2}' | sed 's|refs/tags/||' | sort -V | tail -1)
          fi
          echo "Upstream tag: $TAG"
          git config user.name "djcristi"
          git config user.email "djcristi16@gmail.com"
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream master
          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/upstream-$TAG"
          BASE=$(git merge-base HEAD upstream/master)
          # revision = number of mod builds already released for this upstream tag, plus one
          MAXR=$(gh release list --limit 200 --json tagName -q '.[].tagName' | sed -n "s/^\(mods-\)\{0,1\}$TAG-\(mod-\)\{0,1\}r\([0-9][0-9]*\)$/\3/p" | sort -n | tail -1)
          MAXR=${MAXR:-0}
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # scheduled runs only react to a new upstream version, never to new mod commits
            REV=1
            if [ "$MAXR" -gt 0 ]; then
              echo "Upstream $TAG already released (r$MAXR), nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ inputs.force }}" = "true" ] && [ "$MAXR" -gt 0 ]; then
            REV=$MAXR
          else
            REV=$((MAXR + 1))
          fi
          REL="$TAG-mod-r$REV"
          echo "Mods base: $BASE, revision: $REV, release: $REL"
          echo "orig=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "rel=$REL" >> "$GITHUB_OUTPUT"

      - name: Rebase mods onto the tag
        if: steps.tag.outputs.skip != 'true'
        id: rebase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BASE="${{ steps.tag.outputs.base }}"
          git log --oneline "$BASE"..HEAD
          PLIST="Stats/Supporting Files/Info.plist"
          ok=1
          git rebase --onto "upstream-$TAG" "$BASE" || {
            # upstream bumps CFBundleVersion in Info.plist on every release; take upstream's file, ModRevision is added at build time
            while git rebase --show-current-patch >/dev/null 2>&1; do
              U=$(git diff --name-only --diff-filter=U)
              if [ "$U" = "$PLIST" ]; then
                git checkout --ours -- "$PLIST"
                git add "$PLIST"
                GIT_EDITOR=true git rebase --continue || true
              else
                echo "Unresolvable conflict in: $U"
                ok=0
                break
              fi
            done
          }
          if [ "$ok" != 1 ]; then
            git rebase --abort || true
            MSG="Rebasing mods onto $TAG failed with conflicts. Run: git rebase --onto $TAG $BASE mods, resolve, push mods (the push rebuilds)."
            echo "::error::$MSG"
            gh issue create --title "mods conflict on upstream $TAG" --body "$MSG" || true
            exit 1
          fi

      - name: Select Xcode
        if: steps.tag.outputs.skip != 'true'
        run: sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer

      - name: Build
        if: steps.tag.outputs.skip != 'true'
        run: |
          /usr/libexec/PlistBuddy -c "Set :ModRevision ${{ steps.tag.outputs.rev }}" "Stats/Supporting Files/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :ModRevision string ${{ steps.tag.outputs.rev }}" "Stats/Supporting Files/Info.plist"
          xcodebuild -scheme Stats -destination 'platform=macOS' -configuration Release \
            archive -archivePath build/Stats.xcarchive CODE_SIGNING_ALLOWED=NO
          mkdir -p dist
          ditto build/Stats.xcarchive/Products/Applications/Stats.app dist/Stats-mod.app
          codesign --force --deep --sign - dist/Stats-mod.app
          codesign -dv dist/Stats-mod.app 2>&1 | head -3
          ditto -c -k --keepParent dist/Stats-mod.app Stats-mod.zip
          mkdir -p dmgroot && cp -R dist/Stats-mod.app dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Stats-mod" -srcfolder dmgroot -ov -format UDZO Stats-mod.dmg

      - name: Publish release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REL="${{ steps.tag.outputs.rel }}"
          REV="${{ steps.tag.outputs.rev }}"
          gh release delete "$REL" --yes --cleanup-tag 2>/dev/null || true
          git tag -f "$REL" HEAD
          git push origin "refs/tags/$REL" --force
          gh release create "$REL" Stats-mod.dmg Stats-mod.zip --verify-tag \
            --title "$REL" \
            --notes "Upstream $TAG with the mods branch (revision $REV) rebased on top. Ad-hoc signed. First install from a browser download: run \`xattr -cr Stats-mod.app\`. Later updates are installed by the app itself."

      - name: Move mods onto the new base
        if: steps.tag.outputs.skip != 'true'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ORIG="${{ steps.tag.outputs.orig }}"
          git push origin "refs/tags/upstream-$TAG:refs/tags/$TAG" || echo "::warning::could not mirror upstream tag $TAG"
          if [ "$(git rev-parse HEAD)" = "$ORIG" ]; then
            echo "mods already based on $TAG"
          else
            # lease: refuse if mods moved since this run started (a push made meanwhile is not overwritten)
            git push --force-with-lease="mods:$ORIG" origin HEAD:refs/heads/mods \
              || echo "::warning::mods not moved onto $TAG (it changed during the run or the push was rejected); rebase locally"
          fi

      - name: Move master onto the new base
        run: |
          git fetch --no-tags origin master
          ORIGM=$(git rev-parse origin/master)
          if git merge-base --is-ancestor upstream/master "$ORIGM"; then
            echo "master already contains upstream master"
            exit 0
          fi
          git worktree add -q --detach /tmp/wtm "$ORIGM"
          cd /tmp/wtm
          MB=$(git merge-base HEAD upstream/master)
          if ! git rebase --onto upstream/master "$MB"; then
            git rebase --abort || true
            echo "::warning::master not moved onto upstream master (rebase conflict)"
            exit 0
          fi
          git push --force-with-lease="master:$ORIGM" origin HEAD:refs/heads/master \
            || echo "::warning::master not moved onto upstream master (push rejected, upstream changed workflow files? needs a token with workflow scope)"
